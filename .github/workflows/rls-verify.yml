name: RLS verification

# Runs scripts/verify-rls-security.mjs against the production Supabase project
# (it is the only project; there is no staging). Closes #225.
#
# Why production is acceptable here:
#   - The anonymous section is read-only, except the view write probes
#     (#472): they are filtered on a nil key that is read first, so they
#     never match a row.
#   - The signed-in sections (enabled only when RLS_TEST_* secrets exist) use
#     reads and the same zero-row view probes. Base-table INSERT/UPDATE probes
#     require explicit mutation opt-in; even no-op updates can fire triggers.
#   - RLS_ALLOW_MUTATION_TESTS is deliberately never set here, so the admin
#     manual-check-in insert/delete and base-table write probes never run in CI.
#
# Retirement rollout phase: the member-account / code check-in retirement
# migration is applied to production by hand, after the PR merges, so what is
# true of the hosted database changes at that moment. RLS_RETIREMENT_PHASE
# selects which assertions run (pre-migration is the default and describes
# production before the migration; post-migration requires the retired archives
# to be revoked from every API role, and fails if the ordinary-user and admin
# test accounts are not configured rather than skipping them). Sequence: merge, apply the migration,
# run this workflow manually with phase=post-migration, then set the repository
# variable RLS_RETIREMENT_PHASE=post-migration so PR, push and scheduled runs
# follow. See docs/member-account-retirement.md.
#
# Member lookup rollout phase: the same sequence for
# 20261009232329_admin_member_lookup_rpcs.sql. RLS_MEMBER_LOOKUP_PHASE
# defaults to pre-migration (admin_lookup_members / admin_search_members may be
# absent). post-migration makes them mandatory for anon, ordinary users and
# admins (missing is a failure) and requires both test accounts. Sequence:
# merge, apply the migration, run this workflow manually with
# member_lookup_phase=post-migration, then set the repository variable
# RLS_MEMBER_LOOKUP_PHASE=post-migration. See docs/rls-verification-checklist.md.
#
# House rollout phases: the same sequence for two House privacy migrations.
# RLS_HOUSE_EMBARGO_PHASE covers 20261028073000_embargo_public_house_scores.sql
# (#692): post-migration requires the five House score views and
# admin_private_house_standings to be denied to anon (42501) and leaves those
# views out of anon's write-grant probe, since a role without SELECT cannot be
# probed there. RLS_HOUSE_CACHE_PHASE covers
# 20261028083000_restrict_public_members_house_cache.sql (#704): post-migration
# requires anon to be denied public_members.house and to keep the rest of the
# public member projection. Neither requires the signed-in test accounts: the
# anon contract is fully asserted, and the ordinary-user and admin variants run
# whenever RLS_TEST_* are configured. The pre-migration default fails loudly
# once a migration is applied; that failure is the reminder to flip the
# variable. Sequence: merge, apply the migration, run this workflow manually
# with house_embargo_phase / house_cache_phase=post-migration, then set the
# repository variable. See docs/rls-verification-checklist.md.
#
# Why a schedule as well as PRs: RLS regressions here have come from database
# changes made outside PRs (#422, #423 found dashboard-created policies), which
# no code change would trigger. The daily run catches those.
#
# When it fails: the log names the table/column/RPC and the issue it guards.
# Treat it as a security incident, not a flaky test. See
# docs/rls-verification-checklist.md.

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: '17 15 * * *'
  workflow_dispatch:
    inputs:
      retirement_phase:
        description: 'Retirement migration phase to verify (default: repository variable RLS_RETIREMENT_PHASE, else pre-migration)'
        required: false
        type: choice
        options:
          - ''
          - pre-migration
          - post-migration
      member_lookup_phase:
        description: 'Member lookup RPC migration phase to verify (default: repository variable RLS_MEMBER_LOOKUP_PHASE, else pre-migration)'
        required: false
        type: choice
        options:
          - ''
          - pre-migration
          - post-migration
      house_embargo_phase:
        description: 'House score embargo migration phase to verify (default: repository variable RLS_HOUSE_EMBARGO_PHASE, else pre-migration)'
        required: false
        type: choice
        options:
          - ''
          - pre-migration
          - post-migration
      house_cache_phase:
        description: 'public_members.house cache migration phase to verify (default: repository variable RLS_HOUSE_CACHE_PHASE, else pre-migration)'
        required: false
        type: choice
        options:
          - ''
          - pre-migration
          - post-migration

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Secrets are not passed to pull requests from forks, nor to Dependabot's
    # PRs (they only see Dependabot secrets). A dependency bump can't change
    # database policy, and the daily scheduled run still covers production.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fail closed after the retirement or member lookup migration: "retired
      # archives are closed to anon, ordinary users AND admins" and "admins can
      # use the lookup RPCs, ordinary users are refused" cannot be shown by a
      # run whose signed-in sections were skipped. Existing accounts only; never create a
      # public member account for this check.
      - name: Require signed-in test accounts for post-migration verification
        if: ${{ (inputs.retirement_phase || vars.RLS_RETIREMENT_PHASE) == 'post-migration' || (inputs.member_lookup_phase || vars.RLS_MEMBER_LOOKUP_PHASE) == 'post-migration' }}
        run: |
          missing=""
          for name in RLS_TEST_USER_EMAIL RLS_TEST_USER_PASSWORD RLS_TEST_ADMIN_EMAIL RLS_TEST_ADMIN_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Post-migration RLS verification cannot be skipped::Missing repository secrets:$missing. Post-migration verification needs an existing ordinary authenticated account AND an approved admin account."
            exit 1
          fi
        env:
          RLS_TEST_USER_EMAIL: ${{ secrets.RLS_TEST_USER_EMAIL }}
          RLS_TEST_USER_PASSWORD: ${{ secrets.RLS_TEST_USER_PASSWORD }}
          RLS_TEST_ADMIN_EMAIL: ${{ secrets.RLS_TEST_ADMIN_EMAIL }}
          RLS_TEST_ADMIN_PASSWORD: ${{ secrets.RLS_TEST_ADMIN_PASSWORD }}

      - name: Verify RLS and grants
        run: node scripts/verify-rls-security.mjs
        env:
          REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
          # Optional: signed-in sections are skipped until these are configured.
          RLS_TEST_USER_EMAIL: ${{ secrets.RLS_TEST_USER_EMAIL }}
          RLS_TEST_USER_PASSWORD: ${{ secrets.RLS_TEST_USER_PASSWORD }}
          RLS_TEST_ADMIN_EMAIL: ${{ secrets.RLS_TEST_ADMIN_EMAIL }}
          RLS_TEST_ADMIN_PASSWORD: ${{ secrets.RLS_TEST_ADMIN_PASSWORD }}
          RLS_TEST_EVENT_ID: ${{ secrets.RLS_TEST_EVENT_ID }}
          RLS_TEST_MEMBER_ID: ${{ secrets.RLS_TEST_MEMBER_ID }}
          RLS_RETIREMENT_PHASE: ${{ inputs.retirement_phase || vars.RLS_RETIREMENT_PHASE }}
          RLS_MEMBER_LOOKUP_PHASE: ${{ inputs.member_lookup_phase || vars.RLS_MEMBER_LOOKUP_PHASE }}
          RLS_HOUSE_EMBARGO_PHASE: ${{ inputs.house_embargo_phase || vars.RLS_HOUSE_EMBARGO_PHASE }}
          RLS_HOUSE_CACHE_PHASE: ${{ inputs.house_cache_phase || vars.RLS_HOUSE_CACHE_PHASE }}
