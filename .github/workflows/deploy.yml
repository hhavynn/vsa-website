name: Deploy VSA Website

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  IMAGE_NAME: hhavynn/vsa-website

jobs:
  # Test and Lint
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: CI=true npm test -- --coverage --watchAll=false

      - name: Build application
        run: npm run build
        env:
          REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}

  # Security Scanning
  #
  # This repository is PRIVATE, and code scanning (SARIF upload, the Security
  # tab, CodeQL results) is not available on private repos without a paid plan.
  # The previous `codeql-action/upload-sarif` step therefore failed every run.
  # There was also a `codeql-action/init` with no matching `analyze` step, so it
  # built a CodeQL database nothing consumed. Between them, this job produced no
  # security findings at all.
  #
  # Decision (owner, 2026-07-29): not worth paying for. Trivy reports to the job
  # log instead — free, and enough for a project this size.
  #
  # If this repo is ever made PUBLIC, code scanning becomes free: re-add
  # `security-events: write` + `actions: read`, switch Trivy back to
  # `format: sarif` with `output:`, and add a `codeql-action/upload-sarif` step.
  # Real CodeQL scanning would also need an `analyze` step, which never existed.
  #
  # Triage rule (added 2026-07-31, closes #230):
  # The job log will show HIGH/CRITICAL advisories on every run — this is
  # expected background noise from CRA's transitive dependency tree and is NOT
  # actionable by itself.  Someone (owner or maintainer) should glance at the
  # security job log after each run and act if:
  #   - a NEW critical advisory appears in a direct dependency (check
  #     package.json; transitive-only advisories stay on the noise floor), or
  #   - the total HIGH+CRITICAL count jumps sharply (>10 new findings) compared
  #     to the previous run, suggesting a newly published advisory affects a
  #     widely-used transitive package worth investigating.
  # When either condition is met, open an issue and bump exit-code to '1' here
  # temporarily so CI gates on that class of finding until it's resolved.
  #
  # Secret scanning / push protection: confirmed UNAVAILABLE on this private
  # repo without a paid GitHub plan (verified via `gh api repos/hhavynn/
  # vsa-website --jq '.security_and_analysis'` → null, 2026-07-31).  There is
  # no toggle to enable these features on the current plan — do not re-investigate
  # this as an open question; the answer is a paid-plan upgrade.
  security:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          # Report only. The CRA dependency tree currently carries dozens of
          # HIGH/CRITICAL transitive advisories, so failing on them would make
          # CI permanently red without telling anyone anything new. Choosing a
          # threshold to actually gate on is tracked in #230.
          exit-code: '0'

  # Build and Push Docker Image
  build:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            REACT_APP_SUPABASE_URL=${{ secrets.REACT_APP_SUPABASE_URL }}
            REACT_APP_SUPABASE_ANON_KEY=${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}

  # Deploy to Vercel
  deploy-vercel:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check for Vercel secrets
        id: check-vercel
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "vercel-available=false" >> $GITHUB_OUTPUT
            echo "Vercel token not found, skipping deployment"
          else
            echo "vercel-available=true" >> $GITHUB_OUTPUT
            echo "Vercel token found, proceeding with deployment"
          fi

      - name: Setup Node.js
        if: steps.check-vercel.outputs.vercel-available == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Deploy to Vercel
        if: steps.check-vercel.outputs.vercel-available == 'true'
        run: npx vercel@latest --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.PROJECT_ID }}

