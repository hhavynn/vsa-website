name: Deploy VSA Website

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  # Lets the image-migration workflows start a production deploy explicitly. Pushes made
  # with GITHUB_TOKEN never trigger the push event above.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  IMAGE_NAME: hhavynn/vsa-website

jobs:
  # Test and Lint
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Type-check
        # `npm run build` type-checks with react-scripts' TypeScript 4.9, which
        # cannot parse zod's v4 typings and so skips semantic checking of
        # everything (including test files, which Jest never type-checks).
        # This runs TypeScript 5 against the same sources. See
        # docs/typechecking.md (#290).
        run: npm run typecheck

      - name: Run tests
        run: CI=true npm test -- --coverage --watchAll=false

      - name: Re-run date-boundary tests in other timezones
        # Application windows and summer break are defined in San Diego time and
        # must not shift for a runner or admin elsewhere (#274, #270).
        run: npm run test:timezones

      - name: Build application
        run: npm run build
        env:
          REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}

  # Edge Functions (Deno): type-check and unit tests (#296)
  #
  # Nothing here can reach production. The tests replace `fetch`, point
  # SUPABASE_URL at a `.invalid` host, use fake keys, and run without
  # --allow-net, so an unmocked network call fails instead of connecting. No
  # repository secrets are used. Deno only downloads the pinned/ranged remote
  # imports the functions already depend on (esm.sh, deno.land).
  # A dependency of build and deploy-vercel, so a red run here blocks a
  # production deploy of the same commit.
  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Deno 2 treats the repo's package.json as its npm configuration, so it
      # needs the project's node_modules (for example @types/node) to resolve
      # types, exactly as on a developer machine.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.8.2

      - name: Type-check Edge Functions
        run: npm run typecheck:edge

      - name: Test Edge Functions
        run: npm run test:edge

  # Security Scanning (dependency advisories)
  #
  # The repository is public, so code scanning is free: Trivy's results are
  # uploaded as SARIF and appear on the Security tab, where each alert can be
  # triaged and dismissed with a reason. CodeQL (source analysis) runs in its
  # own workflow, .github/workflows/codeql.yml, so it never blocks a deploy.
  # Secret scanning and push protection are enabled in repo settings.
  #
  # Report only (exit-code 0). The CRA dependency tree carries dozens of
  # transitive advisories in build tooling that never ship to the browser;
  # failing on them would make CI permanently red and teach everyone to
  # ignore it. `npm audit --omit=dev` is the number that describes shipped
  # code. Triage rule (#230): the known transitive build-only advisories are
  # the noise floor. Every NEW CRITICAL gets a reachability check whether it's
  # direct or transitive (code bundled through a direct dependency can still
  # reach the browser); act on any new HIGH/CRITICAL that is runtime-reachable,
  # or on a sharp jump in the total. Gating on "new HIGH/CRITICAL in a runtime
  # dependency" is the intended next step once a few runs show the baseline.
  # This job is a dependency of build/deploy-vercel, so any gate added here
  # blocks production deploys.
  security:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'MEDIUM,HIGH,CRITICAL'
          exit-code: '0'

      - name: Upload Trivy results to code scanning
        # Runs for fork PRs too: code scanning accepts SARIF uploads from fork
        # pull requests, so external contributions get dependency results.
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

  # Build and Push Docker Image
  build:
    runs-on: ubuntu-latest
    needs: [test, security, edge-functions]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            REACT_APP_SUPABASE_URL=${{ secrets.REACT_APP_SUPABASE_URL }}
            REACT_APP_SUPABASE_ANON_KEY=${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}

  # Deploy to Vercel
  deploy-vercel:
    runs-on: ubuntu-latest
    needs: [test, security, edge-functions]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check for Vercel secrets
        id: check-vercel
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "vercel-available=false" >> $GITHUB_OUTPUT
            echo "Vercel token not found, skipping deployment"
          else
            echo "vercel-available=true" >> $GITHUB_OUTPUT
            echo "Vercel token found, proceeding with deployment"
          fi

      - name: Setup Node.js
        if: steps.check-vercel.outputs.vercel-available == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Deploy to Vercel
        if: steps.check-vercel.outputs.vercel-available == 'true'
        run: npx vercel@latest --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.PROJECT_ID }}

