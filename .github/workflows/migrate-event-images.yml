name: Migrate event images to static assets

on:
  workflow_dispatch:
    inputs:
      category:
        description: "Image category to migrate"
        required: true
        default: "events"
        type: choice
        options:
          - "events"
          - "house-events"
      apply:
        description: "Apply changes (download images, update DB). Default false = dry run."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      event_id:
        description: "Optional: migrate a single event by UUID (events category only)"
        required: false
        type: string
      house_event_id:
        description: "Optional: migrate a single House event by UUID (house-events category only)"
        required: false
        type: string
      limit:
        description: "Max number of event rows to process (default: 20)"
        required: false
        default: "20"
        type: string
  repository_dispatch:
    types: [event-image-migration-requested, house-event-image-migration-requested]

# Prevent duplicate migrations for the same event. Different events run independently.
# Falls back to 'batch' for manual runs with no event_id.
concurrency:
  group: event-image-migration-${{ github.event_name == 'repository_dispatch' && (github.event.client_payload.event_id || github.event.client_payload.house_event_id) || inputs.event_id || inputs.house_event_id || 'batch' }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # to dispatch deploy.yml after pushing files

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Guard — apply mode must run on main
        # repository_dispatch always runs in apply mode; manual apply= true also guarded here.
        if: ${{ (inputs.apply == 'true' || github.event_name == 'repository_dispatch') && github.ref != 'refs/heads/main' }}
        env:
          CURRENT_REF: ${{ github.ref }}
        run: |
          echo "ERROR: Apply mode is only allowed on the main branch."
          echo "Current ref: $CURRENT_REF"
          echo "Apply commits files to the current branch and relinks rows to what"
          echo "main serves; only main's deploy is what production serves."
          exit 1

      # client_payload comes from the webhook Edge Function and inputs from a human;
      # both are untrusted text. They reach the shell only through env (never inline
      # ${{ }} expansion, which would execute an injected `"; cmd; #`) and must pass
      # the allowlists below before any later step uses the outputs.
      - name: Build migration args
        id: args
        env:
          EVENT_NAME: ${{ github.event_name }}
          PAYLOAD_CATEGORY: ${{ github.event.client_payload.category }}
          PAYLOAD_EVENT_ID: ${{ github.event.client_payload.event_id }}
          PAYLOAD_HOUSE_EVENT_ID: ${{ github.event.client_payload.house_event_id }}
          INPUT_CATEGORY: ${{ inputs.category }}
          INPUT_EVENT_ID: ${{ inputs.event_id }}
          INPUT_HOUSE_EVENT_ID: ${{ inputs.house_event_id }}
          INPUT_APPLY: ${{ inputs.apply }}
          INPUT_LIMIT: ${{ inputs.limit }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            CATEGORY="${PAYLOAD_CATEGORY:-events}"
            EVENT_ID="$PAYLOAD_EVENT_ID"
            HOUSE_EVENT_ID="$PAYLOAD_HOUSE_EVENT_ID"
            APPLY_MODE="true"
            LIMIT="1"
          else
            CATEGORY="$INPUT_CATEGORY"
            EVENT_ID="$INPUT_EVENT_ID"
            HOUSE_EVENT_ID="$INPUT_HOUSE_EVENT_ID"
            APPLY_MODE="$INPUT_APPLY"
            LIMIT="${INPUT_LIMIT:-20}"
          fi

          UUID_RE='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          case "$CATEGORY" in
            events|house-events) ;;
            *) echo "::error::Unsupported category"; exit 1 ;;
          esac
          case "$APPLY_MODE" in
            true|false) ;;
            *) echo "::error::apply must be true or false"; exit 1 ;;
          esac
          if [ -n "$EVENT_ID" ] && ! [[ "$EVENT_ID" =~ $UUID_RE ]]; then
            echo "::error::event_id must be a UUID"; exit 1
          fi
          if [ -n "$HOUSE_EVENT_ID" ] && ! [[ "$HOUSE_EVENT_ID" =~ $UUID_RE ]]; then
            echo "::error::house_event_id must be a UUID"; exit 1
          fi
          if ! [[ "$LIMIT" =~ ^[0-9]+$ ]]; then
            echo "::error::limit must be a whole number"; exit 1
          fi

          ARGS="--category $CATEGORY"
          if [ -n "$EVENT_ID" ]; then
            ARGS="$ARGS --event-id $EVENT_ID"
          fi
          if [ -n "$HOUSE_EVENT_ID" ]; then
            ARGS="$ARGS --house-event-id $HOUSE_EVENT_ID"
          fi
          if [ -n "$LIMIT" ]; then
            ARGS="$ARGS --limit $LIMIT"
          fi
          if [ "$APPLY_MODE" = "true" ]; then
            ARGS="$ARGS --apply"
          fi

          echo "MIGRATION_ARGS=$ARGS" >> "$GITHUB_OUTPUT"
          echo "APPLY_MODE=$APPLY_MODE" >> "$GITHUB_OUTPUT"
          echo "CATEGORY=$CATEGORY" >> "$GITHUB_OUTPUT"

      # Dry run (apply=false) is read-only. Apply mode writes files + a relink plan and
      # never touches the database; rows are relinked in the last step (#454).
      - name: Run migration
        env:
          REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MIGRATION_ARGS: ${{ steps.args.outputs.MIGRATION_ARGS }}
        # MIGRATION_ARGS is unquoted on purpose: it holds several validated flags.
        run: npx tsx scripts/migrate-supabase-images-to-public.ts $MIGRATION_ARGS --plan-out "$RUNNER_TEMP/image-relink-plan.json"

      - name: Commit and push migrated images
        id: commit
        if: ${{ steps.args.outputs.APPLY_MODE == 'true' }}
        env:
          CATEGORY: ${{ steps.args.outputs.CATEGORY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage specific category directory
          if [ "$CATEGORY" = "house-events" ]; then
            git add public/images/house-events/
          else
            git add public/images/events/
          fi
          
          if git diff --cached --quiet; then
            echo "No new image files to commit."
          else
            git commit -m "chore: migrate $CATEGORY images to static assets"
            # A failed push fails the job here, so the relink step below never runs
            # and no row is pointed at a file that did not ship.
            for attempt in 1 2 3; do
              git push && break
              if [ "$attempt" = "3" ]; then echo "::error::push failed; rows left on Storage URLs"; exit 1; fi
              git pull --rebase origin main
            done
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN do not trigger other workflows, so start the
      # production deploy explicitly (deploy.yml no-ops its Vercel step if VERCEL_TOKEN
      # is unset, in which case the Vercel git integration is the deploy path).
      - name: Start production deploy
        if: ${{ steps.commit.outputs.pushed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      # Relink only after production serves the new file (image content-type + exact
      # byte length), via a conditional update. Not-yet-served rows keep their Storage
      # URL and are retried by the next run. Never deletes Storage originals.
      - name: Wait for deploy, then relink database rows
        if: ${{ steps.args.outputs.APPLY_MODE == 'true' }}
        env:
          REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: ${{ vars.SITE_URL || 'https://www.vsaatucsd.com' }}
        run: |
          npx tsx scripts/migrate-supabase-images-to-public.ts \
            --relink "$RUNNER_TEMP/image-relink-plan.json" \
            --base-url "$SITE_URL" \
            --wait-seconds 900
